<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell, LabelList } = window.Recharts;

        const TITULOS_RANGOS = { vencido: "Vencidos", riesgo: "Riesgo Crítico", preventiva: "Alerta Preventiva", plazo: "Dentro de Plazo" };
        const COLORS = { vencido: '#dc2626', riesgo: '#f59e0b', preventiva: '#a855f7', plazo: '#10b981', otros: '#6366f1' };

        const parseDateStr = (dStr) => {
            if (!dStr || dStr === '-' || dStr.trim() === '') return null;
            let parts = dStr.includes('/') ? dStr.split('/') : dStr.split('-');
            if (parts.length !== 3) return null;
            return parts[0].length === 4 ? new Date(parts[0], parts[1]-1, parts[2]) : new Date(parts[2], parts[1]-1, parts[0]);
        };
        
        const formatDateStr = (dStr) => {
            let d = parseDateStr(dStr);
            return d ? `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}` : dStr;
        };

        const App = () => {
          const [data, setData] = useState([]);
          const [totalRegistros, setTotalRegistros] = useState(0); 
          const [activeTab, setActiveTab] = useState('GENERAL'); 
          const [fileError, setFileError] = useState(''); 
          const [logoError, setLogoError] = useState(false);
          
          const [searchTerm, setSearchTerm] = useState('');
          const [filterEtiqueta, setFilterEtiqueta] = useState('Todos');
          const [filterEstado, setFilterEstado] = useState('Todos');
          const [filterDestinatario, setFilterDestinatario] = useState('Todos');
          const [filterTipo, setFilterTipo] = useState('Todos');
          const [filterTipoPlazo, setFilterTipoPlazo] = useState('Todos');
          const [filterFoco, setFilterFoco] = useState('Todos');

          const [manualCorte, setManualCorte] = useState(() => {
            try {
              const metaScript = document.getElementById('dashboard-meta');
              if (metaScript && metaScript.textContent.trim() !== '') {
                const meta = JSON.parse(metaScript.textContent);
                if (meta.manualCorte) return meta.manualCorte;
              }
            } catch (e) {}
            const date = new Date();
            const meses = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
            return `${date.getDate()} DE ${meses[date.getMonth()]} DEL ${date.getFullYear()} - ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')} ${date.getHours() >= 12 ? 'P.M.' : 'A.M.'}`;
          });

          // NUEVO: Detector de Modo Visor 100% seguro basado en JSON interno
          const [isViewer] = useState(() => {
            try {
              const metaScript = document.getElementById('dashboard-meta');
              if (metaScript && metaScript.textContent.trim() !== '') {
                const meta = JSON.parse(metaScript.textContent);
                return meta.isViewer === true;
              }
            } catch (e) {}
            return false;
          });

          useEffect(() => {
            try {
              const dataScript = document.getElementById('dashboard-data');
              if (dataScript && dataScript.textContent.trim() !== '') {
                const loadedData = JSON.parse(dataScript.textContent);
                const processedData = loadedData.map(row => processRowData(row));
                setData(processedData);
                setTotalRegistros(processedData.length);
              }
            } catch (e) { console.error("Error cargando data inicial", e); }
          }, []);

          const processRowData = (row) => {
              let isFijo = row.plazo && row.plazo !== '-' && row.plazo !== '';
              let fechaEmision = parseDateStr(row.fecha);
              let fechaPlazo = parseDateStr(row.plazo);
              let now = new Date(); now.setHours(0,0,0,0);

              let diasTransNum = row.diasTranscurridos !== '' && row.diasTranscurridos != null ? parseFloat(row.diasTranscurridos) : (fechaEmision ? Math.floor((now - fechaEmision)/(1000*60*60*24)) : 0);
              let diasEntregaNum = isFijo ? (row.diasEntrega !== '' && row.diasEntrega != null && row.diasEntrega !== '-' ? parseFloat(row.diasEntrega) : (fechaPlazo ? Math.floor((fechaPlazo - now)/(1000*60*60*24)) : null)) : null;

              let etiquetaFinal = row.etiqueta;
              if (!etiquetaFinal || etiquetaFinal === '') {
                  if (isFijo) {
                      if (diasEntregaNum !== null && diasEntregaNum < 0) etiquetaFinal = 'Vencido';
                      else if (diasEntregaNum !== null && diasEntregaNum <= 2) etiquetaFinal = 'Riesgo crítico';
                      else if (diasEntregaNum !== null && diasEntregaNum <= 5) etiquetaFinal = 'Alerta preventiva';
                      else etiquetaFinal = 'Dentro de plazo';
                  } else {
                      if (diasTransNum > 30) etiquetaFinal = 'Vencido';
                      else if (diasTransNum >= 15) etiquetaFinal = 'Riesgo crítico';
                      else if (diasTransNum >= 6) etiquetaFinal = 'Alerta preventiva';
                      else etiquetaFinal = 'Dentro de plazo';
                  }
              }

              return {
                  ...row,
                  fecha: formatDateStr(row.fecha),
                  plazo: isFijo ? formatDateStr(row.plazo) : '-',
                  diasTranscurridos: isNaN(diasTransNum) ? 0 : diasTransNum,
                  diasEntrega: isNaN(diasEntregaNum) || diasEntregaNum === null ? null : diasEntregaNum,
                  tipoPlazo: isFijo ? 'Fijo' : 'Regular',
                  etiqueta: etiquetaFinal
              };
          };

          const parseCSV = (text) => {
            const firstLineIdx = text.indexOf('\n');
            const firstLine = firstLineIdx > -1 ? text.substring(0, firstLineIdx) : text;
            const delimiter = firstLine.includes(';') ? ';' : ',';
            
            const results = [];
            let current = '', row = [], inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
              const char = text[i], nextChar = text[i+1];
              if (char === '"') {
                if (inQuotes && nextChar === '"') { current += '"'; i++; } else { inQuotes = !inQuotes; }
              } else if (char === delimiter && !inQuotes) {
                row.push(current); current = '';
              } else if ((char === '\n' || char === '\r') && !inQuotes) {
                if (char === '\r' && nextChar === '\n') i++; 
                row.push(current);
                if (row.some(cell => cell && cell.trim() !== '')) results.push(row);
                row = []; current = '';
              } else { current += char; }
            }
            if (current || row.length > 0) { row.push(current); results.push(row); }
            if (results.length < 2) return { datos: [], totalExcel: 0 };

            let headerRowIndex = 0;
            for (let i = 0; i < Math.min(10, results.length); i++) {
              if (results[i].some(cell => cell && cell.toUpperCase().includes('NRO DE EMISI'))) { headerRowIndex = i; break; }
            }
            const headers = results[headerRowIndex].map(h => h ? h.trim().toUpperCase() : '');
            
            const colIdx = {
              id: headers.findIndex(h => h.includes('NRO DE EMISI')),
              fecha: headers.findIndex(h => h.includes('FECHA EMISI')),
              remitente: headers.findIndex(h => h.includes('REMITENTE')),
              tipo: headers.findIndex(h => h.includes('TIPO DOCUMENTO')),
              nroDoc: headers.findIndex(h => h.includes('NRO DOCUMENTO')),
              destinatario: headers.findIndex(h => h.includes('DESTINA')),
              asunto: headers.findIndex(h => h.includes('ASUNTO')),
              expediente: headers.findIndex(h => h.includes('EXPEDIENTE')),
              estado: headers.findIndex(h => h.includes('ESTADO')),
              comentario: headers.findIndex(h => h.includes('COMENTARIO')),
              plazo: headers.findIndex(h => h === 'PLAZO' || h.includes('FECHA MAX')),
              diasTranscurridos: headers.findIndex(h => h.includes('DIAS TRANSCURRIDOS') || h === 'DIAS' || h === 'DÍAS'),
              diasEntrega: headers.findIndex(h => h.includes('DIAS PARA ENTREGA')),
              etiqueta: headers.findIndex(h => h.includes('ETIQUETA')),
              equipo: headers.findIndex(h => h === 'EQUIPO' || h.includes('EQUIPO'))
            };

            const mappedRows = results.slice(headerRowIndex + 1).map(r => {
              const idVal = colIdx.id > -1 ? r[colIdx.id] : r[0];
              if (!idVal || String(idVal).trim() === '') return null;
              
              const rawRow = {
                  id: String(idVal).trim(),
                  fecha: String(colIdx.fecha > -1 ? r[colIdx.fecha] : r[1]).trim(),
                  remitente: String(colIdx.remitente > -1 ? r[colIdx.remitente] : r[2]).trim(),
                  tipo: String(colIdx.tipo > -1 ? r[colIdx.tipo] : r[3]).trim(),
                  nroDoc: String(colIdx.nroDoc > -1 ? r[colIdx.nroDoc] : r[4]).trim(),
                  destinatario: String(colIdx.destinatario > -1 ? r[colIdx.destinatario] : r[5]).trim(),
                  asunto: String(colIdx.asunto > -1 ? r[colIdx.asunto] : r[6]).replace(/\n/g, ' ').replace(/\r/g, '').trim(),
                  expediente: String(colIdx.expediente > -1 ? r[colIdx.expediente] : r[7]).trim(),
                  estado: String(colIdx.estado > -1 ? r[colIdx.estado] : r[8]).trim(),
                  comentario: String(colIdx.comentario > -1 ? (r[colIdx.comentario] || '') : '').trim(),
                  plazo: String(colIdx.plazo > -1 ? (r[colIdx.plazo] || '') : '').trim(),
                  diasTranscurridos: String(colIdx.diasTranscurridos > -1 ? (r[colIdx.diasTranscurridos] || '') : '').trim(),
                  diasEntrega: String(colIdx.diasEntrega > -1 ? (r[colIdx.diasEntrega] || '') : '').trim(),
                  etiqueta: String(colIdx.etiqueta > -1 ? (r[colIdx.etiqueta] || '') : '').trim(),
                  equipo: String(colIdx.equipo > -1 ? (r[colIdx.equipo] || '') : '').trim()
              };
              return processRowData(rawRow);
            }).filter(Boolean);

            return { datos: mappedRows, totalExcel: mappedRows.length };
          };

          const handleFileUpload = (e) => {
            setFileError('');
            const file = e.target.files[0];
            if (file) {
              const ext = file.name.split('.').pop().toLowerCase();
              const reader = new FileReader();
              
              if (ext === 'csv') {
                reader.onload = (event) => procesarDatosGenerales(event.target.result);
                reader.readAsText(file);
              } else if (ext === 'xlsx' || ext === 'xls') {
                reader.onload = (event) => {
                  try {
                      const data = new Uint8Array(event.target.result);
                      const workbook = window.XLSX.read(data, {type: 'array'});
                      let targetSheetName = workbook.SheetNames[0];
                      for (let name of workbook.SheetNames) {
                          const csvPreview = window.XLSX.utils.sheet_to_csv(workbook.Sheets[name]);
                          if (csvPreview.includes('NRO DE EMISI') || csvPreview.includes('NRO DOCUMENTO')) { targetSheetName = name; break; }
                      }
                      const csvText = window.XLSX.utils.sheet_to_csv(workbook.Sheets[targetSheetName]);
                      procesarDatosGenerales(csvText);
                  } catch (err) { setFileError('Error leyendo Excel. Verifica el formato.'); }
                };
                reader.readAsArrayBuffer(file);
              } else { setFileError('Sube un archivo CSV o Excel (.xlsx) válido.'); }
            }
          };

          const procesarDatosGenerales = (text) => {
            const result = parseCSV(text);
            if (result && result.datos && result.datos.length > 0) {
              setData(result.datos); setTotalRegistros(result.totalExcel); setFileError('');
              const now = new Date();
              const meses = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
              setManualCorte(`${now.getDate()} DE ${meses[now.getMonth()]} DEL ${now.getFullYear()} - ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} ${now.getHours() >= 12 ? 'P.M.' : 'A.M.'}`);
            } else { setFileError('No se encontraron registros válidos.'); }
          };

          const handleExport = () => {
            try {
              // 1. Clona el documento de forma limpia en la memoria (evita bugs de Regex)
              const clone = document.documentElement.cloneNode(true);
              
              // 2. Limpia el área principal para que React la vuelva a dibujar fresca al abrir
              const rootElement = clone.querySelector('#root');
              if (rootElement) rootElement.innerHTML = '';
              
              // 3. Limpia scripts residuales (Babel, extensiones) para no ensuciar el HTML exportado
              const scripts = clone.querySelectorAll('script');
              scripts.forEach(script => {
                  if (!script.id && !script.src && script.type !== 'text/babel' && script.type !== 'application/json') {
                      script.remove();
                  }
              });

              // 4. Inyecta los nuevos datos directamente al contenedor JSON seguro
              const dataScript = clone.querySelector('#dashboard-data');
              if (dataScript) dataScript.textContent = JSON.stringify(data, null, 2);
              
              const metaScript = clone.querySelector('#dashboard-meta');
              if (metaScript) {
                  // MAGIA: Guardamos "isViewer: true" en el archivo que se va a descargar
                  metaScript.textContent = JSON.stringify({ 
                      lastUpdated: new Date().toISOString(), 
                      manualCorte: manualCorte,
                      isViewer: true 
                  }, null, 2);
              }

              // 6. Empaqueta el archivo y lo descarga
              const finalHtml = '<!DOCTYPE html>\n<html lang="es">\n' + clone.innerHTML + '\n</html>';
              const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `Dashboard_OPPMI_${new Date().toISOString().split('T')[0]}.html`;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
            } catch (error) {
              console.error("Error crítico al exportar:", error);
            }
          };

          const { uniqueTipos, uniqueDestinatarios, uniqueTipoPlazos, uniqueEstados, uniqueEtiquetas } = useMemo(() => {
              const matchSearch = (item) => {
                  const searchStr = searchTerm.toLowerCase();
                  return (item.id || '').toLowerCase().includes(searchStr) || (item.asunto || '').toLowerCase().includes(searchStr) || (item.destinatario || '').toLowerCase().includes(searchStr);
              };
              const matchTab = (item) => activeTab === 'GENERAL' || (item.equipo || '').toUpperCase().includes(activeTab);
              
              const matchTipo = (item) => filterTipo === 'Todos' || (item.tipo || '').trim() === filterTipo;
              const matchDest = (item) => filterDestinatario === 'Todos' || (item.destinatario || '').trim() === filterDestinatario;
              const matchPlazo = (item) => filterTipoPlazo === 'Todos' || item.tipoPlazo === filterTipoPlazo;
              const matchEst = (item) => filterEstado === 'Todos' || (item.estado || '').toUpperCase() === filterEstado;
              const matchEtiq = (item) => filterEtiqueta === 'Todos' || item.etiqueta === filterEtiqueta;

              const base = data.filter(item => matchSearch(item) && matchTab(item));

              const baseForTipo = base.filter(item => matchDest(item) && matchPlazo(item) && matchEst(item) && matchEtiq(item));
              const uTipos = ['Todos', ...Array.from(new Set(baseForTipo.map(d => (d.tipo||'').trim()).filter(Boolean))).sort()];

              const baseForDest = base.filter(item => matchTipo(item) && matchPlazo(item) && matchEst(item) && matchEtiq(item));
              const uDestinatarios = ['Todos', ...Array.from(new Set(baseForDest.map(d => (d.destinatario||'').trim()).filter(Boolean))).sort()];

              const baseForPlazo = base.filter(item => matchTipo(item) && matchDest(item) && matchEst(item) && matchEtiq(item));
              const uTipoPlazos = ['Todos', ...Array.from(new Set(baseForPlazo.map(d => (d.tipoPlazo||'').trim()).filter(Boolean))).sort()];

              const baseForEstado = base.filter(item => matchTipo(item) && matchDest(item) && matchPlazo(item) && matchEtiq(item));
              const uEstados = ['Todos', ...Array.from(new Set(baseForEstado.map(d => (d.estado||'').trim().toUpperCase()).filter(Boolean))).sort()];

              const baseForEtiqueta = base.filter(item => matchTipo(item) && matchDest(item) && matchPlazo(item) && matchEst(item));
              const uEtiquetas = ['Todos', ...Array.from(new Set(baseForEtiqueta.map(d => (d.etiqueta||'').trim()).filter(Boolean))).sort()];

              return { uniqueTipos: uTipos, uniqueDestinatarios: uDestinatarios, uniqueTipoPlazos: uTipoPlazos, uniqueEstados: uEstados, uniqueEtiquetas: uEtiquetas };
          }, [data, searchTerm, activeTab, filterTipo, filterDestinatario, filterTipoPlazo, filterEstado, filterEtiqueta]);

          useEffect(() => {
              if (filterTipo !== 'Todos' && !uniqueTipos.includes(filterTipo)) setFilterTipo('Todos');
              if (filterDestinatario !== 'Todos' && !uniqueDestinatarios.includes(filterDestinatario)) setFilterDestinatario('Todos');
              if (filterTipoPlazo !== 'Todos' && !uniqueTipoPlazos.includes(filterTipoPlazo)) setFilterTipoPlazo('Todos');
              if (filterEstado !== 'Todos' && !uniqueEstados.includes(filterEstado)) setFilterEstado('Todos');
              if (filterEtiqueta !== 'Todos' && !uniqueEtiquetas.includes(filterEtiqueta)) setFilterEtiqueta('Todos');
          }, [uniqueTipos, uniqueDestinatarios, uniqueTipoPlazos, uniqueEstados, uniqueEtiquetas, filterTipo, filterDestinatario, filterTipoPlazo, filterEstado, filterEtiqueta]);

          const filteredData = useMemo(() => {
            return data.filter(item => {
              const mSearch = (item.id || '').toLowerCase().includes(searchTerm.toLowerCase()) || (item.asunto || '').toLowerCase().includes(searchTerm.toLowerCase()) || (item.destinatario || '').toLowerCase().includes(searchTerm.toLowerCase());
              const mTab = activeTab === 'GENERAL' || (item.equipo || '').toUpperCase().includes(activeTab);
              const mTipo = filterTipo === 'Todos' || (item.tipo || '').trim() === filterTipo;
              const mDest = filterDestinatario === 'Todos' || (item.destinatario || '').trim() === filterDestinatario;
              const mPlazo = filterTipoPlazo === 'Todos' || item.tipoPlazo === filterTipoPlazo;
              const mEstado = filterEstado === 'Todos' || (item.estado || '').toUpperCase() === filterEstado;
              const mEtiqueta = filterEtiqueta === 'Todos' || item.etiqueta === filterEtiqueta;
              return mSearch && mTab && mTipo && mDest && mPlazo && mEstado && mEtiqueta;
            });
          }, [data, searchTerm, activeTab, filterTipo, filterDestinatario, filterTipoPlazo, filterEstado, filterEtiqueta]);

          const stats = useMemo(() => ({
            total: filteredData.length,
            vencidos: filteredData.filter(d => (d.etiqueta || '').toLowerCase().includes('vencido')).length,
            riesgo: filteredData.filter(d => (d.etiqueta || '').toLowerCase().includes('riesgo')).length,
            preventiva: filteredData.filter(d => (d.etiqueta || '').toLowerCase().includes('preventiva')).length,
            enPlazo: filteredData.filter(d => (d.etiqueta || '').toLowerCase().includes('plazo')).length,
          }), [filteredData]);

          const equipoStats = useMemo(() => {
            let oppmi = 0, presupuesto = 0, inversiones = 0;
            data.forEach(d => {
                const eq = (d.equipo || '').toUpperCase();
                if (eq.includes('OPPMI')) oppmi++;
                if (eq.includes('PRESUPUESTO')) presupuesto++;
                if (eq.includes('INVERSIONES')) inversiones++;
            });
            return { oppmi, presupuesto, inversiones };
          }, [data]);

          const focoCriticoData = useMemo(() => {
            return filteredData
              .filter(d => {
                const tag = (d.etiqueta || '').toLowerCase();
                return tag.includes('vencido') || tag.includes('riesgo');
              })
              .sort((a, b) => {
                const aVencido = (a.etiqueta || '').toLowerCase().includes('vencido') ? -1 : 1;
                const bVencido = (b.etiqueta || '').toLowerCase().includes('vencido') ? -1 : 1;
                if (aVencido !== bVencido) return aVencido - bVencido;
                const valA = a.tipoPlazo === 'Fijo' ? a.diasEntrega : -a.diasTranscurridos;
                const valB = b.tipoPlazo === 'Fijo' ? b.diasEntrega : -b.diasTranscurridos;
                return valA - valB;
              });
          }, [filteredData]);

          const focoCriticoTarjetas = useMemo(() => {
            return focoCriticoData.filter(d => {
              if (filterFoco === 'Todos') return true;
              if (filterFoco === 'Vencido' && (d.etiqueta || '').toLowerCase().includes('vencido')) return true;
              if (filterFoco === 'Riesgo crítico' && (d.etiqueta || '').toLowerCase().includes('riesgo')) return true;
              return false;
            });
          }, [focoCriticoData, filterFoco]);

          const chartData = useMemo(() => {
            const counts = {};
            filteredData.forEach(d => { counts[d.etiqueta || 'Otros'] = (counts[d.etiqueta || 'Otros'] || 0) + 1; });
            return Object.keys(counts).map(key => ({ name: key, value: counts[key] }));
          }, [filteredData]);

          const barData = useMemo(() => {
            const destCounts = {};
            filteredData.forEach(d => {
              const parts = (d.destinatario || '').trim().split(/\s+/) || [];
              let shortName = parts.length >= 3 ? `${parts[2]} ${parts[0]}` : (parts.length === 2 ? `${parts[1]} ${parts[0]}` : (d.destinatario || "Sin Asignar"));
              destCounts[shortName] = (destCounts[shortName] || 0) + 1;
            });
            return Object.keys(destCounts).map(name => ({ name, documentos: destCounts[name] })).sort((a, b) => b.documentos - a.documentos);
          }, [filteredData]);

          return (
            <div className="min-h-screen bg-[#f8fafc] p-4 md:p-8 font-sans text-slate-900 relative">
              <header className="bg-gradient-to-r from-blue-50 via-indigo-50 to-indigo-100 rounded-[2rem] p-6 md:p-8 shadow-lg shadow-indigo-200/50 border border-indigo-200 mb-6 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 relative overflow-hidden">
                <div className="flex flex-col sm:flex-row items-start sm:items-center gap-6 relative z-10 w-full xl:w-auto">
                  <div className="bg-white p-2.5 rounded-2xl shadow-sm border border-white shrink-0 flex items-center justify-center min-w-[60px] min-h-[60px]">
                      {!logoError ? (
                          <img src="MINAM LOGO.jpg" alt="MINAM" className="h-12 sm:h-14 object-contain" onError={() => setLogoError(true)} />
                      ) : (
                          <span className="text-2xl font-black text-red-700 tracking-tighter px-2">MINAM</span>
                      )}
                  </div>
                  <div className="hidden sm:block h-16 w-0.5 bg-indigo-200 rounded-full"></div>
                  <div className="flex-1 w-full">
                    <h1 className="text-2xl sm:text-3xl font-black text-indigo-950 tracking-tight">SEGUIMIENTO DOCUMENTAL - OPPMI</h1>
                    <div className="flex flex-wrap items-center gap-3 mt-3">
                      <div className="flex items-center gap-2 p-1.5 rounded-xl border w-full sm:w-auto transition-colors bg-white/70 border-indigo-300 shadow-sm">
                        <span className="text-[10px] font-black text-indigo-800 bg-indigo-200/80 px-2 py-1 rounded uppercase tracking-wider shrink-0">CORTE:</span>
                        <input type="text" className="text-xs sm:text-sm font-bold text-indigo-900 bg-transparent border-none focus:ring-0 focus:outline-none w-full sm:w-[260px]" value={manualCorte} onChange={(e) => setManualCorte(e.target.value)} />
                      </div>
                      <div className="flex items-center gap-2 text-[11px] font-bold text-indigo-700 bg-white/60 px-3 py-2 rounded-xl border border-indigo-100 shadow-sm">
                        <i className="fa-solid fa-database text-indigo-500"></i> {filteredData.length} asignados (Total: {data.length})
                      </div>
                    </div>
                  </div>
                </div>
                
                {!isViewer && (
                  <div className="flex flex-col sm:flex-row gap-3 w-full xl:w-auto z-10">
                    <button onClick={handleExport} className="flex items-center justify-center gap-3 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-4 rounded-[2rem] transition-all shadow-md shadow-indigo-600/30">
                      <i className="fa-solid fa-download text-xl"></i>
                      <div className="text-left leading-tight"><span className="block text-sm font-black">Exportar</span><span className="block text-[10px] font-bold opacity-80 uppercase">Solo HTML</span></div>
                    </button>
                    <div className="flex flex-col gap-1">
                      <label className="flex items-center gap-4 bg-white/90 px-6 py-4 border-2 border-dashed border-indigo-300 rounded-[2rem] cursor-pointer hover:border-indigo-500 transition-all shadow-sm">
                        <i className="fa-solid fa-file-excel text-indigo-400 text-2xl"></i>
                        <div className="text-left"><span className="block text-sm font-black text-indigo-950">Cargar Datos</span><span className="block text-[10px] text-indigo-500 font-bold uppercase">CSV o Excel</span></div>
                        <input type="file" className="hidden" accept=".csv, .xlsx, .xls" onChange={handleFileUpload} />
                      </label>
                      {fileError && <span className="text-red-600 text-[10px] font-bold ml-2 animate-pulse">{fileError}</span>}
                    </div>
                  </div>
                )}
              </header>

              {}
              <div className="flex space-x-2 bg-slate-200/50 p-1.5 rounded-[1.2rem] mb-8 border border-slate-200 shadow-inner overflow-x-auto no-scrollbar">
                  {['GENERAL', 'OPPMI', 'PRESUPUESTO', 'INVERSIONES'].map(tab => (
                      <button key={tab} onClick={() => setActiveTab(tab)} className={`flex-1 min-w-[120px] py-3.5 px-6 rounded-xl text-[11px] font-black uppercase tracking-[0.15em] transition-all duration-300 ${activeTab === tab ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-300/50 scale-[1.02]' : 'bg-transparent text-slate-500 hover:bg-white hover:text-indigo-600'}`}>
                          {tab === 'GENERAL' ? <i className="fa-solid fa-layer-group mr-2 opacity-70"></i> : <i className="fa-solid fa-folder-open mr-2 opacity-70"></i>} {tab}
                      </button>
                  ))}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-6 mb-8">
                <StatCard title="Total Pendientes" value={stats.total} iconClass="fa-solid fa-file-lines" color="text-indigo-600" bg="bg-indigo-50" />
                <StatCard title={TITULOS_RANGOS.vencido} value={stats.vencidos} iconClass="fa-solid fa-triangle-exclamation" color="text-red-700" bg="bg-red-100" />
                <StatCard title={TITULOS_RANGOS.riesgo} value={stats.riesgo} iconClass="fa-solid fa-clock" color="text-amber-600" bg="bg-amber-50" />
                <StatCard title={TITULOS_RANGOS.preventiva} value={stats.preventiva} iconClass="fa-solid fa-bell" color="text-purple-600" bg="bg-purple-50" />
                <StatCard title={TITULOS_RANGOS.plazo} value={stats.enPlazo} iconClass="fa-solid fa-circle-check" color="text-emerald-600" bg="bg-emerald-50" />
              </div>

              {activeTab === 'GENERAL' && (
                <div className="flex flex-wrap items-center gap-3 mb-6 px-2">
                    <span className="text-[10px] font-black text-indigo-400 uppercase tracking-[0.2em] mr-2"><i className="fa-solid fa-chart-pie mr-1.5"></i>Por Equipo:</span>
                    <div className="bg-blue-50 px-4 py-2 rounded-xl flex items-center gap-3 shadow-sm border border-blue-100">
                        <span className="text-[10px] font-black text-blue-900 uppercase">OPPMI</span>
                        <span className="text-xs font-black text-blue-600 bg-white px-2 py-0.5 rounded-lg">{equipoStats.oppmi}</span>
                    </div>
                    <div className="bg-emerald-50 px-4 py-2 rounded-xl flex items-center gap-3 shadow-sm border border-emerald-100">
                        <span className="text-[10px] font-black text-emerald-900 uppercase">Presupuesto</span>
                        <span className="text-xs font-black text-emerald-600 bg-white px-2 py-0.5 rounded-lg">{equipoStats.presupuesto}</span>
                    </div>
                    <div className="bg-amber-50 px-4 py-2 rounded-xl flex items-center gap-3 shadow-sm border border-amber-100">
                        <span className="text-[10px] font-black text-amber-900 uppercase">Inversiones</span>
                        <span className="text-xs font-black text-amber-600 bg-white px-2 py-0.5 rounded-lg">{equipoStats.inversiones}</span>
                    </div>
                </div>
              )}

              {}
              {focoCriticoData.length > 0 && (
                <div className="mb-10">
                  <div className="bg-gradient-to-br from-indigo-700 via-indigo-600 to-blue-700 rounded-[2.5rem] shadow-2xl shadow-indigo-600/30 overflow-hidden flex flex-col lg:flex-row relative border border-indigo-500/50 min-h-[580px]">
                      
                      <div className="p-8 lg:p-10 lg:w-[360px] shrink-0 border-b lg:border-b-0 lg:border-r border-indigo-500/50 relative z-10 flex flex-col justify-between bg-indigo-900/10">
                          <div>
                              <div className="inline-flex items-center gap-3 bg-white/10 backdrop-blur-md border border-white/20 px-4 py-2.5 rounded-full mb-8 shadow-xl w-fit">
                                  <div className="relative flex h-3 w-3 shrink-0">
                                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                      <span className="relative inline-flex rounded-full h-3 w-3 bg-red-500 shadow-[0_0_8px_rgba(239,68,68,1)]"></span>
                                  </div>
                                  <h2 className="text-white font-black uppercase tracking-[0.2em] text-xs">Foco Crítico</h2>
                              </div>
                              <div className="flex items-center gap-6 mb-10 text-white">
                                  <div className="text-[7.5rem] font-black leading-none tracking-tighter drop-shadow-lg">{focoCriticoTarjetas.length}</div>
                                  <div className="text-lg font-bold leading-tight opacity-90 uppercase tracking-wide">Documentos<br/>Prioritarios</div>
                              </div>
                          </div>
                          
                          <div className="mt-auto">
                              <div className="flex gap-2">
                                  <button onClick={() => setFilterFoco('Todos')} className={`flex-1 py-3 rounded-xl text-xs font-black uppercase transition-all ${filterFoco === 'Todos' ? 'bg-white text-indigo-700 shadow-lg scale-105' : 'bg-white/10 text-indigo-100 hover:bg-white/20'}`}>Todos</button>
                                  <button onClick={() => setFilterFoco('Vencido')} className={`flex-1 py-3 rounded-xl text-xs font-black uppercase transition-all ${filterFoco === 'Vencido' ? 'bg-red-500 text-white shadow-lg shadow-red-500/50 scale-105' : 'bg-white/10 text-indigo-100 hover:bg-white/20'}`}>Vencidos</button>
                                  <button onClick={() => setFilterFoco('Riesgo crítico')} className={`flex-1 py-3 rounded-xl text-xs font-black uppercase transition-all ${filterFoco === 'Riesgo crítico' ? 'bg-amber-500 text-white shadow-lg shadow-amber-500/50 scale-105' : 'bg-white/10 text-indigo-100 hover:bg-white/20'}`}>Riesgos</button>
                              </div>
                          </div>
                      </div>

                      <div className="p-6 lg:p-8 flex-1 min-w-0 bg-white/5 relative z-10 overflow-hidden flex items-center">
                          <div className="grid grid-rows-2 grid-flow-col gap-6 overflow-x-auto pb-4 foco-scrollbar h-full w-full items-start">
                              {focoCriticoTarjetas.map(doc => (
                                  <div key={doc.id} className="bg-white rounded-[1.5rem] p-6 w-[320px] h-[260px] shadow-lg flex flex-col shrink-0 border-l-[6px]" style={{ borderLeftColor: (doc.etiqueta||'').toLowerCase().includes('vencido') ? COLORS.vencido : COLORS.riesgo }}>
                                      <div className="shrink-0 mb-3">
                                          <div className="flex justify-between items-start mb-3">
                                              <span className="text-[11px] font-black text-slate-500 bg-slate-100 px-3 py-1.5 rounded">{doc.id}</span>
                                              <span className="text-[10px] font-black px-3 py-1.5 rounded bg-slate-200 text-slate-600">{doc.equipo || 'GENERAL'}</span>
                                          </div>
                                          <div className="text-sm font-black text-slate-800 uppercase leading-snug">{doc.destinatario}</div>
                                      </div>

                                      <div className="flex-1 overflow-y-auto asunto-scrollbar bg-slate-50 p-3 rounded-xl">
                                          <div className="text-[11px] text-slate-600 italic">"{doc.asunto}"</div>
                                      </div>
                                      
                                      <div className="shrink-0 mt-4 flex items-end justify-between border-t border-slate-100 pt-4">
                                          <div className="flex flex-col">
                                              <span className="text-[10px] font-black uppercase text-red-600">{doc.tipoPlazo === 'Fijo' ? 'Vence' : 'Antigüedad'}</span>
                                              <span className="text-sm font-bold">{doc.tipoPlazo === 'Fijo' ? doc.plazo : `${doc.diasTranscurridos} días`}</span>
                                          </div>
                                          <span className={`text-[11px] font-black px-3 py-1.5 rounded ${
                                              (doc.etiqueta||'').toLowerCase().includes('vencido') ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'
                                          }`}>{doc.etiqueta}</span>
                                      </div>
                                  </div>
                              ))}
                              {focoCriticoTarjetas.length === 0 && (
                                  <div className="text-indigo-200 font-bold col-span-full self-center justify-self-center mt-10">
                                      ¡Excelente! No hay documentos prioritarios en este filtro.
                                  </div>
                              )}
                          </div>
                      </div>
                  </div>
                </div>
              )}

              {}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10">
                {/* Gráfico Circular Rediseñado: Sin etiquetas externas, centrado, altura restringida */}
                <div className="bg-white p-6 lg:p-8 rounded-[2.5rem] shadow-xl border border-slate-100 flex flex-col h-[400px]">
                  <h2 className="text-lg font-black mb-2 text-slate-800 shrink-0"><i className="fa-solid fa-filter text-indigo-500 mr-2"></i>Estado Global</h2>
                  <div className="flex-1 w-full min-h-0 relative">
                    <ResponsiveContainer width="100%" height="100%">
                      <PieChart>
                        <Pie 
                            data={chartData} 
                            cx="50%" 
                            cy="45%" 
                            innerRadius={70} 
                            outerRadius={100} 
                            paddingAngle={5} 
                            dataKey="value"
                        >
                          {chartData.map((entry, index) => (
                            <Cell key={`cell-${index}`} fill={entry.name.toLowerCase().includes('vencido') ? COLORS.vencido : entry.name.toLowerCase().includes('riesgo') ? COLORS.riesgo : entry.name.toLowerCase().includes('preventiva') ? COLORS.preventiva : COLORS.plazo} strokeWidth={0} />
                          ))}
                        </Pie>
                        <Tooltip contentStyle={{ borderRadius: '1rem', border: 'none', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)' }} />
                        <Legend verticalAlign="bottom" height={36} iconType="circle" wrapperStyle={{ fontSize: '11px', fontWeight: 'bold' }} />
                      </PieChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                {/* Gráfico de Barras Rediseñado: Escala automática inteligente y contenedor min-h-0 */}
                <div className="lg:col-span-2 bg-white p-6 lg:p-8 rounded-[2.5rem] shadow-xl border border-slate-100 h-[400px] flex flex-col">
                  <h2 className="text-lg font-black mb-2 text-slate-800 shrink-0"><i className="fa-solid fa-user text-blue-500 mr-2"></i>Carga por Especialista</h2>
                  <div className="flex-1 w-full overflow-y-auto foco-scrollbar pr-2 min-h-0">
                    <div style={{ height: Math.max(250, barData.length * 45) + 'px', width: '100%' }}>
                      <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={barData} layout="vertical" margin={{ left: 10, right: 50 }}>
                          <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} stroke="#f1f5f9" />
                          <XAxis type="number" hide />
                          <YAxis dataKey="name" type="category" width={160} fontSize={11} tickLine={false} axisLine={false} fontStyle="bold" />
                          <Tooltip cursor={{fill: '#f8fafc'}} contentStyle={{ borderRadius: '1rem', border: 'none', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)' }} />
                          <Bar dataKey="documentos" fill="#6366f1" radius={[0, 12, 12, 0]} barSize={24}>
                            <LabelList dataKey="documentos" position="right" fill="#475569" fontSize={13} fontWeight="900" />
                          </Bar>
                        </BarChart>
                      </ResponsiveContainer>
                    </div>
                  </div>
                </div>
              </div>

              {}
              <div className="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden">
                <div className="p-6 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                  <input type="text" placeholder={`Buscar asunto/ID en ${filteredData.length} documentos...`} className="w-full md:w-1/2 p-3 bg-white border border-slate-200 rounded-xl focus:outline-none font-bold text-sm shadow-sm" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                </div>
                
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-slate-100 border-b border-slate-200">
                        <th className="p-4 align-top text-center w-12">
                          <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">N°</div>
                        </th>
                        
                        <th className="p-4 align-top w-40">
                          <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Ref / Tipo</div>
                          <select className="w-full p-2 text-[10px] border border-slate-300 rounded-lg font-bold text-slate-700 bg-white shadow-sm focus:ring-indigo-500 outline-none cursor-pointer" value={filterTipo} onChange={(e) => setFilterTipo(e.target.value)}>
                            {uniqueTipos.map(t => <option key={t} value={t}>{t}</option>)}
                          </select>
                        </th>
                        
                        <th className="p-4 align-top">
                          <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Destinatario & Asunto</div>
                          <select className="w-full p-2 text-[10px] border border-slate-300 rounded-lg font-bold text-slate-700 bg-white shadow-sm focus:ring-indigo-500 outline-none cursor-pointer" value={filterDestinatario} onChange={(e) => setFilterDestinatario(e.target.value)}>
                            {uniqueDestinatarios.map(d => <option key={d} value={d}>{d}</option>)}
                          </select>
                        </th>
                        
                        <th className="p-4 align-top text-center w-32">
                          <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Plazo / Tipo</div>
                          <select className="w-full p-2 text-[10px] border border-slate-300 rounded-lg font-bold text-slate-700 bg-white shadow-sm focus:ring-indigo-500 outline-none cursor-pointer" value={filterTipoPlazo} onChange={(e) => setFilterTipoPlazo(e.target.value)}>
                            {uniqueTipoPlazos.map(op => <option key={op} value={op}>{op === 'Fijo' ? 'Fijo (Vence)' : op === 'Regular' ? 'Regular (Días)' : 'Todos'}</option>)}
                          </select>
                        </th>
                        
                        <th className="p-4 align-top text-center w-36">
                          <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Estado</div>
                          <select className="w-full p-2 text-[10px] border border-slate-300 rounded-lg font-bold text-slate-700 bg-white shadow-sm focus:ring-indigo-500 outline-none cursor-pointer" value={filterEstado} onChange={(e) => setFilterEstado(e.target.value)}>
                            {uniqueEstados.map(e => <option key={e} value={e}>{e}</option>)}
                          </select>
                        </th>
                        
                        <th className="p-4 align-top text-center w-40">
                          <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Prioridad</div>
                          <select className="w-full p-2 text-[10px] border border-slate-300 rounded-lg font-bold text-slate-700 bg-white shadow-sm focus:ring-indigo-500 outline-none cursor-pointer" value={filterEtiqueta} onChange={(e) => setFilterEtiqueta(e.target.value)}>
                            {uniqueEtiquetas.map(eq => <option key={eq} value={eq}>{eq}</option>)}
                          </select>
                        </th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredData.map((row, idx) => (
                          <tr key={idx} className="hover:bg-indigo-50/30 transition-colors group">
                            <td className="p-4 text-center align-top text-xs font-bold text-slate-400">{idx + 1}</td>
                            <td className="p-4 align-top">
                              <div className="text-sm font-black text-slate-800">{row.id}</div>
                              <div className="text-[10px] text-slate-500 mt-1">{row.nroDoc}</div>
                              {row.equipo && <div className="mt-2 text-[9px] font-bold bg-indigo-100 text-indigo-700 w-fit px-2 py-0.5 rounded">{row.equipo}</div>}
                            </td>
                            <td className="p-4 min-w-[350px] align-top">
                              <div className="text-xs font-extrabold text-slate-700 mb-2 uppercase">{row.destinatario}</div>
                              <div className="overflow-y-auto max-h-[80px] asunto-scrollbar bg-slate-50 p-2 rounded-lg border border-slate-100">
                                <div className="text-[11px] text-slate-600 italic leading-relaxed">"{row.asunto}"</div>
                              </div>
                            </td>
                            <td className="p-4 text-center align-top">
                                <div className="text-xl font-black text-slate-700">{row.tipoPlazo === 'Fijo' ? Math.abs(row.diasEntrega) : row.diasTranscurridos}d</div>
                                <div className="text-[9px] text-slate-400 uppercase mt-1">{row.tipoPlazo === 'Fijo' ? (row.diasEntrega < 0 ? 'Vencido' : 'Restantes') : 'Transcurridos'}</div>
                            </td>
                            <td className="p-4 align-top text-center">
                              <span className="text-[9px] font-black px-2 py-1 rounded bg-slate-100 text-slate-600 uppercase">{row.estado}</span>
                            </td>
                            <td className="p-4 align-top text-center">
                              <span className={`text-[9px] font-black px-2 py-1 rounded uppercase ${
                                (row.etiqueta||'').toLowerCase().includes('vencido') ? 'bg-red-100 text-red-700' :
                                (row.etiqueta||'').toLowerCase().includes('riesgo') ? 'bg-amber-100 text-amber-700' :
                                (row.etiqueta||'').toLowerCase().includes('preventiva') ? 'bg-purple-100 text-purple-700' :
                                'bg-emerald-100 text-emerald-700'
                              }`}>{row.etiqueta}</span>
                            </td>
                          </tr>
                      ))}
                      {filteredData.length === 0 && (
                          <tr><td colSpan="6" className="p-8 text-center text-slate-400 font-bold">Sin resultados para esta vista.</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          );
        };

        const StatCard = ({ title, value, iconClass, color, bg }) => (
          <div className="bg-white p-6 rounded-[2rem] shadow-lg border border-slate-100 flex items-center justify-between hover:-translate-y-1 transition-transform">
            <div>
              <p className="text-slate-500 text-[10px] font-black uppercase mb-1">{title}</p>
              <p className={`text-[3.5rem] font-black leading-none ${color}`}>{value}</p>
            </div>
            <div className={`w-14 h-14 rounded-2xl flex items-center justify-center ${bg} ${color}`}><i className={`${iconClass} text-2xl`}></i></div>
          </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

<span id="recharts_measurement_span" aria-hidden="true" style="position: absolute; top: -20000px; left: 0px; padding: 0px; margin: 0px; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; white-space: pre; font-size: 11px; letter-spacing: normal;">1.5</span></body>
</html>
